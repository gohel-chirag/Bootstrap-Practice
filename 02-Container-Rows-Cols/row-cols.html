<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Rows & Cols | Web Development</title>
    <!-- Bootstrap CSS Online CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .border {
            border: 5px solid #17252A !important;
        }

        .border-col {
            padding: 10px;
            border: 5px solid #3AAFA9;
        }
    </style>
</head>

<body>
    <!-- Heading -->
    <h1 class="text-center text-primary mt-3">Bootstrap Rows & Cols Class</h1>

    <!-- Container -->
    <div class="container mt-3 border text-center">
        <!-- Row -->
        <div class="row">
            <!-- Cols -->
            <div class="col border-col">1</div>
            <div class="col border-col">2</div>
            <div class="col border-col">3</div>
            <div class="col border-col">4</div>
        </div>

        <!-- Row -->
        <div class="row">
            <!-- Cols -->
            <div class="col border-col">5</div>
            <div class="col border-col">6</div>
        </div>

        <!-- Row -->
        <div class="row">
            <!-- Cols -->
            <div class="col border-col">7</div>
        </div>
    </div>


    <div class="container-fluid mt-5 border text-center">
        <!-- Row -->
        <div class="row">
            <!-- Cols -->
            <div class="col-4 border-col">1</div>
            <div class="col border-col">2</div>
            <div class="col border-col">3</div>
            <div class="col border-col">4</div>
            <div class="col border-col">5</div>
            <div class="col border-col">6</div>
        </div>
        
        <!-- Row -->
        <div class="row">
            <!-- Cols -->
            <div class="col-4 border-col">7</div>
            <div class="col border-col">8</div>
            <div class="col border-col">9</div>
            <div class="col border-col">10</div>
            <div class="col border-col">11</div>
            <div class="col border-col">12</div>
        </div>
    </div>


    <!-- Bootstrap JS Online CDN Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
