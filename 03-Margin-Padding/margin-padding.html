<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Margin & Padding | Web Development</title>
    <!-- Bootstrap CSS Online CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .border{
            border: 2px solid grey !important;
        }
    </style>
</head>
<body>
    <!-- Heading -->
    <h1 class="text-center text-primary mt-3">Bootstrap Margin & Padding</h1>

    <!-- Padding -->
    <div class="container mt-3">
        <div class="row border">
            <!-- Padding 1-5 sudhi use thai sake. p-1, p-2, p-5 -->
            <!-- Padding top : pt-1 -->
            <!-- Padding bottom : pb-1 -->
            <!-- Padding start : ps-1 -->
            <!-- Padding end : pe-1 -->
            <div class="col-6 p-5 border"><h3>Padding</h3></div>
            <div class="col-6 border"><h3>Without Padding</h3></div>
        </div>
        <div class="row border">
            <div class="col-3 pt-5 border"><h3>Padding Top</h3></div>
            <div class="col-3 pb-5 border"><h3>Padding Bottom</h3></div>
            <div class="col-3 ps-5 border"><h3>Padding left</h3></div>
            <div class="col-3 pe-5 border"><h3>Padding right</h3></div>
        </div>
    </div>

    <!-- Margin -->
    <div class="container mt-5">
        <div class="row border">
            <!-- Margin 1-5 sudhi use thai sake. m-1, m-2, m-5 -->
            <!-- Margin top : mt-1 -->
            <!-- Margin bottom : mb-1 -->
            <!-- Margin start : ms-1 -->
            <!-- Margin end : me-1 -->
            <div class="col-6 border"><h3 class="m-5">Margin</h3></div>
            <div class="col-6 border"><h3>Without Margin</h3></div>
        </div>
        <div class="row border">
            <div class="col-3 border"><h3 class="mt-5">Margin Top</h3></div>
            <div class="col-3 border"><h3 class="mb-5">Margin Bottom</h3></div>
            <div class="col-3 border"><h3 class="ms-5">Margin left</h3></div>
            <div class="col-3 border"><h3 class="me-5">Margin right</h3></div>
        </div>
    </div>


    <!-- Bootstrap JS Online CDN Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
