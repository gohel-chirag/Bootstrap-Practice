<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Components | Web Development</title>
    <!-- Bootstrap CSS Online CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Heading -->
    <h1 class="text-center text-primary mt-3">Bootstrap Components</h1>


    <!-- Badges -->
    <div class="container mt-5">
        <!-- Heading Badge -->
        <div class="row mt-5">
            <div class="mb-2">
                <h3>Heading Badges</h3>
            </div>
            <div class="col-12">
                <h1>Example heading <span class="badge text-bg-secondary">New</span></h1>
                <h2>Example heading <span class="badge text-bg-secondary">New</span></h2>
                <h3>Example heading <span class="badge text-bg-secondary">New</span></h3>
                <h4>Example heading <span class="badge text-bg-secondary">New</span></h4>
                <h5>Example heading <span class="badge text-bg-secondary">New</span></h5>
                <h6>Example heading <span class="badge text-bg-secondary">New</span></h6>
            </div>
        </div>


        <!-- Button Badge -->
        <div class="row mt-5">
            <div class="mb-2">
                <h3>Button Badges</h3>
            </div>
            <div class="col-12">
                <button type="button" class="btn btn-primary">
                    Notifications <span class="badge text-bg-secondary">4</span>
                </button>
            </div>
        </div>


        <!-- Positioned Badge -->
        <div class="row mt-5">
            <div class="mb-2">
                <h3>Positioned Badges</h3>
            </div>
            <div class="col-12">
                <button type="button" class="btn btn-primary position-relative">
                    Inbox
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        99+
                        <span class="visually-hidden">unread messages</span>
                    </span>
                </button>
            </div>
        </div>


        <!-- Profile Badge -->
        <div class="row mt-5">
            <div class="mb-2">
                <h3>Profile Badges</h3>
            </div>
            <div class="col-12">
                <button type="button" class="btn btn-primary position-relative">
                    Profile
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
                        <span class="visually-hidden">New alerts</span>
                    </span>
                </button>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS Online CDN Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
