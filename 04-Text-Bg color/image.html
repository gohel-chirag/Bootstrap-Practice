<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Image | Web Development</title>
    <!-- Bootstrap CSS Online CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* border */
        .border {
            border: 2px solid black !important;
        }

        /* Cols Border */
        .col-border{
            border:3px solid red;
        }
    </style>
</head>

<body>
    <!-- Heading -->
    <h1 class="text-center text-primary mt-3">Bootstrap Image</h1>



    <!-- Online Image & Container -->
    <div class="container mt-3 p-3 border">
        <div class="row">
            <div class="text-center">
                <h3>Online Images</h3>
            </div>
            <div class="col-6">
                <img class="img-fluid col-border" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ62mZn-g_FDVhNAYwqwPoESQG3SPPdwb3tqGphpeBmbQ&s=10" alt="Online Image">
            </div>
            <div class="col-6">
                <img class="img-fluid col-border" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ62mZn-g_FDVhNAYwqwPoESQG3SPPdwb3tqGphpeBmbQ&s=10" alt="Online Image">
            </div>
        </div>
    </div>



    <!-- Offline Image & Container-fluid -->
    <div class="container-fluid mt-5 mb-3 p-3 border">
        <div class="row">
            <div class="text-center">
                <h3>Offline Images</h3>
            </div>
            <div class="col-4">
                <img class="img-fluid col-border" src="image.jpg" alt="Offline Image">
            </div>
            <div class="col-4">
                <img class="img-fluid col-border" src="image.jpg" alt="Offline Image">
            </div>
            <div class="col-4">
                <img class="img-fluid col-border" src="image.jpg" alt="Offline Image">
            </div>
        </div>
    </div>
    
    
    <!-- Image Thumbnail -->
    <div class="row m-5">
        <div class="text-center">
            <h3>Image as Thumbnail</h3>
        </div>
        <div class="col-4 p-2 mx-auto">
            <img class="img-fluid img-thumbnail" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHj0r68jZH4eo3fYSF4w2kuacrnLWu69OP644HsnhNkw&s=10" alt="Image as Thumbnail">
        </div>
    </div>


    <!-- Rounded Image -->
    <div class="row m-5">
        <div class="text-center">
            <h3>Rounded Image</h3>
        </div>
        <div class="col-3 mx-auto">
            <img class="img-fluid rounded" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOJ4IZbkwwyJD4dq7MObC7x1gpYN0xVkTOV_X9T9ZCMQ&s=10" alt="Rounded Image">
        </div>
    </div>


    <!-- Rounded-circle Image -->
    <div class="row m-5">
        <div class="text-center">
            <h3>Rounded-Circle Image</h3>
        </div>
        <div class="col-3 mx-auto">
            <img class="img-fluid rounded-circle" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0PmcW6QpVxtWXOhqIIs8Cdwmjvyf79fPD9Y33Vxxe1A&s=10" alt="Rounded-Circle Image">
        </div>
    </div>


    <!-- Figure Image -->
    <div class="row m-5">
        <div class="text-center">
            <h3>Figure</h3>
        </div>
        <div class="col-3 mx-auto">
            <figure class="figure">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAPf_062JKWOBQr9rKxfyjLtlwzCn6Wwx_fJ6vQDIAgQ&s=10" class="figure-img img-fluid rounded" alt="online image">
                <figcaption class="figure-caption text-center">A caption for the above image.</figcaption>
            </figure>
        </div>
    </div>


    <!-- img-thumbnail class thi image thubnail tarike set kari sakai chhe -->
    <!-- Img-fluid class thi image container ma proper set thai chhe -->
    <!-- mx-auto class thi image center ma align thai chhe -->
    <!-- d-block class thi display block thai chhe -->
    <!-- rounded class thi image Rounded thai chhe -->
    <!-- rounded-circle class thi image Rounded-circle thai chhe (profile mate) -->
    <!-- figure & figure-caption class thi image ma caption aapi sakai chhe -->





    <!-- Bootstrap JS Online CDN Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
